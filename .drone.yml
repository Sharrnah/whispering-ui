---
kind: pipeline
type: kubernetes
name: build

steps:
  - name: test-and-build-desktop
    image: golang:1.26.5-bookworm
    environment:
      CGO_ENABLED: 1
      GOTOOLCHAIN: local
    commands:
      - sh BuildTools/install-deps.sh
      # Use pinned Go/Fyne modules. Tags must match FyneApp.toml's Version.Build.
      - python3 BuildTools/build.py --target linux --flavor cu128 --test --package --release-if-tag --output dist/linux/whispering-tiger-linux-amd64-cu128
      # Compile the Windows app and all tests on every build; tests do not run on Linux.
      # Windows release packaging via build.bat / fyne package remains supported.
      - python3 BuildTools/build.py --target windows --test --package --release-if-tag --output "dist/windows/Whispering Tiger.exe"

  - name: upload-build-s3
    image: minio/mc
    environment:
      MINIO_HOST:
        from_secret: s3-endpoint-s3
      MINIO_ACCESS_KEY:
        from_secret: s3-access-key-s3
      MINIO_SECRET_KEY:
        from_secret: s3-secret-key-s3
    commands:
      - mc alias set s3_alias "$${MINIO_HOST}" "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
      - mc cp dist/linux/*.zip s3_alias/projects/whispering-ui/
      - mc cp dist/linux/SHA256SUMS "s3_alias/projects/whispering-ui/$${DRONE_TAG#v}-linux-amd64-cu128.SHA256SUMS"
    when:
      event:
        - tag
    depends_on:
      - test-and-build-desktop

  - name: git-release-linux
    image: plugins/gitea-release
    settings:
      api_key:
        from_secret: docker_password
      base_url: ${DRONE_REPO_LINK%/*/*}
      files:
        - dist/linux/*.zip
        - dist/linux/SHA256SUMS
    when:
      event:
        - tag
    depends_on:
      - test-and-build-desktop

trigger:
  ref:
    exclude:
      - refs/pipelines/*
